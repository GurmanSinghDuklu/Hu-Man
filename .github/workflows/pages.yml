# Preview deploy of the site to GitHub Pages:
# https://gurmansinghduklu.github.io/Hu-Man/
# Built with a /Hu-Man base path and noindex (PUBLIC_NOINDEX) until the real
# domain is chosen (docs/09 item 8).
name: Deploy to GitHub Pages

on:
  push:
    branches: [hu-man-rebrand]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://gurmansinghduklu.github.io
          SITE_BASE: /Hu-Man
          PUBLIC_NOINDEX: '1'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
