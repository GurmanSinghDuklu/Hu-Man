# Preview deploy of the site to GitHub Pages:
# https://gurmansinghduklu.github.io/Hu-Man/
# Built with a /Hu-Man base path and noindex (PUBLIC_NOINDEX) until the real
# domain is chosen (docs/09 item 8).
name: Deploy to GitHub Pages

on:
  push:
    branches: [hu-man-rebrand]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # build runs the endpoint tests, the site build and the SEO/GEO check: any failure stops the deploy.
      - run: npm run build
        env:
          SITE_URL: https://gurmansinghduklu.github.io
          SITE_BASE: /Hu-Man
          PUBLIC_NOINDEX: '1'
          # GitHub Pages has no server for /api/enquiry, so forms open an email instead.
          PUBLIC_FORM_MODE: mailto
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
