# Quality gate on every push and pull request: the enquiry endpoint's tests, types, lint, build,
# the SEO/GEO check and the axe accessibility scan. The production host (docs/10-launch.md) should only deploy commits that
# pass this. Nothing here deploys or publishes anything.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history, so the sitemap's lastmod dates come from real commit dates.
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      # The axe scan's browser. Chromium is kept between runs (keyed by the Playwright version in the
      # lock file), so most runs only install its system packages. Each install is tried twice, so
      # one slow download doesn't fail the run.
      - id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium || (sleep 20 && npx playwright install --with-deps chromium)
      - if: steps.browsers.outputs.cache-hit == 'true'
        timeout-minutes: 8
        run: npx playwright install-deps chromium || (sleep 20 && npx playwright install-deps chromium)
      - run: npm run axe
