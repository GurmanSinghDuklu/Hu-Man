# Cloudflare Workers deployment: the static site (dist/) plus the enquiry endpoint (worker/).
# Build: `npm run build`. Deploy: `npx wrangler deploy` (Workers Builds runs both from Git).
# Setup steps, including Email Routing for the form, are in docs/10-launch.md.
name = "humansoftwareagency"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

# The bare domain only: www redirects to it with a Cloudflare Redirect Rule (docs/10-launch.md),
# so the site never answers on two addresses.
routes = [{ pattern = "humansoftwareagency.com", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"
# /about -> /about/, and unknown paths get the site's own 404 page.
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# The pages the Worker serves first (worker/pages.js): Markdown when a client asks for it, and Link
# headers for the Markdown copy and preloaded fonts (Cloudflare Early Hints). Everything else (CSS,
# fonts, images, video, llms.txt, concepts) stays a plain static file. Exact paths only: /about
# (no slash) still gets its 301 from public/_redirects. seo-check fails if this list and the
# built pages (worker/pages.json) differ, so add a line when you add a page.
# "/api/*" is the forms and client accounts API: without it the static-asset handler answers those
# paths itself (the 404 page, or 405 for a POST) and the Worker never sees them.
# "/admin" and "/admin/*": the team's dashboard, served only to a logged-in admin; everyone else gets
# the 404 page (gateAdminPages in worker/accounts/index.js). "/preview/*": a client's preview of their
# site, from R2, only for them and admins (worker/accounts/preview.js).
run_worker_first = [
  "/api/*",
  "/admin",
  "/admin/*",
  "/preview/*",
  "/",
  "/about/",
  "/agentic-ai-ready/",
  "/business-websites/",
  "/contact/",
  "/cookies/",
  "/free-ai-check/",
  "/how-we-build/",
  "/portfolio/",
  "/pricing/",
  "/privacy/",
  "/services/",
  "/start/",
  "/terms/",
  "/user-agreement/",
  "/web-design-leeds/",
  "/web-design-manchester/",
]

# Email for the enquiry form. The address must be verified in Cloudflare Email Routing first.
[[send_email]]
name = "SEND_EMAIL"
destination_address = "humansoftwareagency@gmail.com"

[vars]
FROM_ADDRESS = "website@humansoftwareagency.com"
TO_ADDRESS = "humansoftwareagency@gmail.com"

# Rate limits for the enquiry form (worker/enquiry.js): 3 sends a minute from one address, 20 a
# minute for the whole site. Stops a bot flooding the inbox; real people never hit them.
[[ratelimits]]
name = "ENQUIRY_PER_IP"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "ENQUIRY_GLOBAL"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Auto-reply to the sender ("We've got your message", worker/enquiry.js). Off until Gurman turns on
# Cloudflare's Email Sending (Workers Paid plan, beta): the binding above can only reach the
# studio's own verified inbox. To switch it on, follow docs/10-launch.md ("Auto-reply"), then
# uncomment these two lines. With no REPLY_EMAIL binding the Worker simply skips it.
# [[send_email]]
# name = "REPLY_EMAIL"

# At most one auto-reply a minute to any one address.
[[ratelimits]]
name = "REPLY_PER_ADDRESS"
namespace_id = "1003"
simple = { limit = 1, period = 60 }

# Client accounts (worker/accounts/, spec docs/superpowers/specs/2026-11-23-client-accounts-design.md).
# Before the first deploy that includes them: `npx wrangler d1 create hm_accounts`, paste its id
# below, `npx wrangler r2 bucket create hm-client-files`, then
# `npx wrangler d1 migrations apply hm_accounts --remote` (docs/10-launch.md, "Client accounts").
# Done 2026-11-23: database created (Western Europe) and migrated; R2 bucket created (Western
# Europe, private: no r2.dev URL, no custom domain). `wrangler dev` uses local copies.
[[d1_databases]]
binding = "DB"
database_name = "hm_accounts"
database_id = "33f482bf-7898-43e9-9909-7cc5793759d8"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "hm-client-files"

# Login: 5 tries a minute from one address (plus the per-account lock in worker/accounts/auth.js).
[[ratelimits]]
name = "LOGIN_PER_IP"
namespace_id = "1004"
simple = { limit = 5, period = 60 }

# Sign-up, code resends and "forgot password": 5 a minute from one address (each sends an email).
[[ratelimits]]
name = "SIGNUP_PER_IP"
namespace_id = "1006"
simple = { limit = 5, period = 60 }

# Brief uploads: 10 a minute per user.
[[ratelimits]]
name = "UPLOAD_PER_USER"
namespace_id = "1005"
simple = { limit = 10, period = 60 }

# Secrets (never in this file or the repo): set each with `npx wrangler secret put <NAME>`.
#   PREVIEW_UPLOAD_TOKEN   lets `npm run preview-upload` put a client's build in their preview.
#   STRIPE_SECRET_KEY      Stripe's secret key (sk_test_… while testing, sk_live_… for real).
#   STRIPE_WEBHOOK_SECRET  the signing secret of the webhook to /api/stripe/webhook (whsec_…).
#   RESEND_API_KEY         Resend's API key, for emails to people (sign-up codes, resets, receipts).
# Plain setting (not secret), in [vars] when set: RESEND_FROM = "Hu/man <hello@humansoftwareagency.com>".
# Without the Stripe ones the pay button says payment details will be emailed instead. For
# `wrangler dev`, put them in site/.dev.vars (git-ignored). Steps: docs/10-launch.md.
