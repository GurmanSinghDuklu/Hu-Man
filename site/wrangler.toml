# Cloudflare Workers deployment: the static site (dist/) plus the enquiry endpoint (worker/).
# Build: `npm run build`. Deploy: `npx wrangler deploy` (Workers Builds runs both from Git).
# Setup steps, including Email Routing for the form, are in docs/10-launch.md.
name = "humansoftwareagency"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

# The bare domain only: www redirects to it with a Cloudflare Redirect Rule (docs/10-launch.md),
# so the site never answers on two addresses.
routes = [{ pattern = "humansoftwareagency.com", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"
# /about -> /about/, and unknown paths get the site's own 404 page.
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# Email for the enquiry form. The address must be verified in Cloudflare Email Routing first.
[[send_email]]
name = "SEND_EMAIL"
destination_address = "humansoftwareagency@gmail.com"

[vars]
FROM_ADDRESS = "website@humansoftwareagency.com"
TO_ADDRESS = "humansoftwareagency@gmail.com"

# Rate limits for the enquiry form (worker/enquiry.js): 3 sends a minute from one address, 20 a
# minute for the whole site. Stops a bot flooding the inbox; real people never hit them.
[[ratelimits]]
name = "ENQUIRY_PER_IP"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "ENQUIRY_GLOBAL"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Auto-reply to the sender ("We've got your message", worker/enquiry.js). Off until Gurman turns on
# Cloudflare's Email Sending (Workers Paid plan, beta): the binding above can only reach the
# studio's own verified inbox. To switch it on, follow docs/10-launch.md ("Auto-reply"), then
# uncomment these two lines. With no REPLY_EMAIL binding the Worker simply skips it.
# [[send_email]]
# name = "REPLY_EMAIL"

# At most one auto-reply a minute to any one address.
[[ratelimits]]
name = "REPLY_PER_ADDRESS"
namespace_id = "1003"
simple = { limit = 1, period = 60 }
